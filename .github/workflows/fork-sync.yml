name: Fork upstream sync

on:
  schedule:
    # Hourly, at minute 17 to avoid the top-of-hour runner queue.
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      build:
        description: 'Run the Windows build after a successful sync'
        required: false
        default: 'false'

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fork/main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure git identity for replayed commits
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Register the upstream remote
        shell: bash
        run: |
          git remote remove upstream 2>/dev/null || true
          git remote add upstream https://github.com/wushuai0802/myfinder-device-battery.git

      - name: Self-check the overlay patch replayer
        shell: bash
        run: python tools/test_fork_overlay.py

      - name: Rebase fork/main onto upstream/main
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git checkout -B fork/main
          if [ "${{ github.event.inputs.build }}" = "true" ]; then
            python tools/fork_sync.py --sync --build
          else
            python tools/fork_sync.py --sync
          fi

      - name: Push the synced branch
        shell: bash
        # Rebase rewrites the SHA of every fork-only commit, so a plain push is
        # rejected as non-fast-forward. --force-with-lease keeps the safety
        # check while allowing the rewritten dedicated sync branch.
        run: git push --force-with-lease origin HEAD:fork/main

      - name: Upload the sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fork-sync-report
          path: logs/fork/
          if-no-files-found: warn
